  # Chicago crimes, the full archive as the extended tier: one artifact per calendar year, 2001
  # through the last closed year. Per year rather than one request because a year is ~21 s and
  # ~130 MB, which fetch.py can retry and resume; one request for 8.2 M rows would be six minutes
  # of hoping. `$order=id` is mandatory for stable paging, and `$limit` is set well above the
  # largest year (486,839 in 2002) so that a file at exactly the limit means truncation -- which the
  # converter checks. The `location` column arrives with embedded newlines and is dropped by the
  # converter, not by `$select`: excluding it server-side triples the request time.
  #
  # These digests are not guaranteed: the portal revises historical records, so a re-fetch months
  # later may not match, by the nature of the source rather than by any fault. Over short intervals
  # it is stable -- 2024 fetched here came back byte-identical to the copy the core dataset fetched
  # earlier, through a different $limit, and 2001 re-fetched identically ten minutes after its first
  # download. R-02's release asset is what makes this verifiable by anyone else regardless.
