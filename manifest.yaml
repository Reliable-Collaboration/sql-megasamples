# Every downloadable artifact the build needs. megasamples/fetch.py is the only reader.
# Adding a mirror never requires editing build logic. See PLAN.md section 2.5.
#
#   id            unique key; also the filename under downloads/
#   dataset       database name this artifact belongs to
#   url           upstream location (authoritative)
#   mirrors       tried in order after url
#   sha256        "" until the first verified fetch; the build then refuses to
#                 proceed unless MEGASAMPLES_TRUST_FIRST_FETCH=1, which writes it back
#   size_bytes    0 when unknown; checked when non-zero
#   license       id of a record in knowledge/licenses/
#   ipv4_first    force curl -4 (hosts with AAAA records known to hang)
#   live          the upstream is a feed that changes (a query against a live portal): a build takes
#                 what it serves today and records what it got; sha256 and size_bytes then describe
#                 the snapshot the dataset's tests were written against, not a pin
#                 (knowledge/decisions/live-artifacts.md)
