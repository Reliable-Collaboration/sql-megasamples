[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-megasamples"
version = "2.0.0"
description = "Sample databases for MySQL, PostgreSQL and SQLite: images, files and a browsing console, built from upstream sources"
requires-python = ">=3.11"
dependencies = [
    "PyMySQL[rsa]==1.2.4",
    "psycopg==3.3.9",
]

[dependency-groups]
dev = ["pytest==9.2.0"]
pipeline = [
    "PyYAML==6.0.3",
    "duckdb==2.0.0",
    "lxml==6.1.3",
    "sqlglot==30.33.0",
    "py7zr==1.1.4",
    "backports.zstd==1.8.0; python_version < '3.14'",
]

[tool.setuptools.packages.find]
include = ["megasamples", "megasamples.*"]

[tool.uv]
default-groups = ["dev", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
