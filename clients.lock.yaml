scope_notes:
- Console image pins already upgraded in engine PR 9 are retained; configured older
  embedded drivers are upgraded independently.
- Python sqlite3 uses the validated tools runtime library 3.54.1; it is part of that
  runtime rather than a PyPI dependency.
- psycopg is a new exact dev dependency for the published-endpoint probe, previously
  an undeclared helper dependency.
- No psycopg2, SQLAlchemy, python-oracledb, mysql-connector-python, pgloader or SQLcl
  import/execution exists in the current repository; knowledge-only references are
  not installed clients.
- CloudBeaver MariaDB driver is present in the vendor image but no MariaDB connection
  is configured. Other unused vendor drivers are not independently selected clients.
- PHP mysqlnd follows the selected current vendor PHP runtime. Adminer libpq is independently
  upgraded to 18.7. The endpoint driver uses pure Psycopg with a separately pinned
  18.7 libpq package; it does not use the older library bundled in the binary wheel.
- Transport/build utilities such as curl, git, compilers, Docker/Compose and Python
  itself are tooling runtimes, not independent database clients. Their observed versions/identities
  are captured where used; no claim is made that the host tooling was upgraded.
- 'DL-074 supersedes the former latest-stable selection: Oracle MySQL CLI/C API 9.7.4,
  Shell 9.7.1 and Connector/J 9.7.0. Connector versions follow their own available
  9.7 patch numbers; none is fabricated to equal the server patch.'
